<div class="card mb-3" id="timeMachineHeatmapCard">
    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h5 class="mb-0">Weekly Matrix</h5>
        <div class="btn-group btn-group-sm" role="group" aria-label="Heatmap units">
            <button type="button" class="btn btn-primary time-machine-mode-effort" aria-pressed="true">Effort (%)</button>
            <button type="button" class="btn btn-outline-primary time-machine-mode-hours" aria-pressed="false">Time (hrs)</button>
        </div>
    </div>
    <div class="card-body">
        <div id="timeMachineHeatmapEmpty" class="text-muted small d-none">No hours logged in this range.</div>
        <div id="timeMachineHeatmap" class="time-machine-heatmap" aria-label="Weekly Matrix"></div>
    </div>
</div>

<div class="card mb-3" id="timeMachinePlotCard">
    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h5 class="mb-0">Weekly Lines</h5>
        <div class="btn-group btn-group-sm" role="group" aria-label="Plot units">
            <button type="button" class="btn btn-primary time-machine-mode-effort" id="timeMachineModeEffort" aria-pressed="true">Effort (%)</button>
            <button type="button" class="btn btn-outline-primary time-machine-mode-hours" id="timeMachineModeHours" aria-pressed="false">Time (hrs)</button>
        </div>
    </div>
    <div class="card-body">
        <div id="timeMachinePlotEmpty" class="text-muted small d-none">No hours logged in this range.</div>
        <div class="row g-3" id="timeMachinePlotContent">
            <div class="col-lg-3">
                <div class="time-machine-legend" id="timeMachineLegend"></div>
            </div>
            <div class="col-lg-9">
                <div class="time-machine-plot">
                    <canvas id="timeMachineChart" aria-label="Weekly Lines"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="card mb-3" id="timeMachineBreakdownCard">
    <div class="card-header">
        <h5 class="mb-0">Weekly breakdown</h5>
    </div>
    <div class="card-body">
        <div id="timeMachineBreakdownEmpty" class="text-muted small d-none">No hours logged in this range.</div>
        <div id="timeMachineBreakdownContent">
            <div class="table-responsive">
                <table class="table table-sm table-hover mb-0 time-grid-breakdown-table">
                    <thead class="table-light">
                        <tr>
                            <th class="time-grid-breakdown-bar-col" aria-label="Range share"></th>
                            <th>Client</th>
                            <th>Project</th>
                            <th class="text-end" id="timeMachineRangeHeader">Last 30 Days</th>
                            <th class="text-end">Weekly Avg</th>
                        </tr>
                    </thead>
                    <tbody id="timeMachineBreakdownBody"></tbody>
                    <tfoot>
                        <tr class="table-light">
                            <td></td>
                            <td colspan="2" class="fw-semibold">Total</td>
                            <td class="text-end fw-semibold" id="timeMachineRangeTotal"><strong>0.0%</strong> (0.0 hrs)</td>
                            <td class="text-end fw-semibold" id="timeMachineWeeklyAvgTotal">0.0 hrs</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</div>
